  - Task
License: GPL-3.0-or-later
AuthorName: Dominik Müller
AuthorWebSite: https://github.com/dominikmuellr
SourceCode: https://github.com/dominikmuellr/trudido
IssueTracker: https://github.com/dominikmuellr/trudido/issues

Name: Trudido
AutoName: trudido
Summary: Privacy-focused todo and notes app
Description: |
  Trudido is a privacy-focused todo and notes app with rich features.

  Features:
  * Task management with categories, priorities, and due dates
  * Rich text notes with markdown support
  * Encrypted vault for private notes (biometric unlock)
  * Calendar integration (DAVx5/Android Calendar sync)
  * Audio recordings, images, and video attachments
  * PDF export
  * Material You dynamic theming
  * Fully offline - no internet required
  * No ads, no tracking

RepoType: git
Repo: https://github.com/dominikmuellr/trudido.git

Builds:
  - versionName: 1.2.2
    versionCode: 13
    commit: v1.2.2
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - web
    prebuild:
      - export flutterVersion=$(sed -n -E 's/^\s*flutter:\s*"?([0-9.]+)"?/\1/p' pubspec.yaml)
      - "[[ $flutterVersion ]] || exit 1"
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.2.2
CurrentVersionCode: 13
