Name: Trudido
AutoName: trudido
Summary: Privacy-friendly, open-source to-do list app. No ads, no tracking.
Description: |
  Trudido is a privacy-focused todo and notes app with rich features.

  Features:
  * Task management with categories, priorities, and due dates
  * Rich text notes with markdown support
  * Encrypted vault for private notes (biometric unlock)
  * Calendar integration (DAVx5/Android Calendar sync)
  * Audio recordings, images, and video attachments
  * PDF export
  * Material You dynamic theming
  * Fully offline - no internet required
  * No ads, no tracking

RepoType: git
Repo: https://github.com/dominikmuellr/trudido.git

Builds:
  - versionName: 1.2.2
    versionCode: 13
    commit: v1.2.2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.35.0
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get
      - flutter build apk --release --no-deferred-components

