# Crowdin configuration file for Trudido Flutter app
# Visit https://support.crowdin.com/configuration-file/ for more info

project_id: "836952" # Replace with your actual Crowdin project ID
api_token_env: "CROWDIN_API_TOKEN" # Environment variable containing your API token
base_path: "."
base_url: "https://api.crowdin.com"

preserve_hierarchy: true

files:
  - source: "lib/l10n/app_en.arb"
    translation: "lib/l10n/app_%locale%.arb"
    languages_mapping:
      two_letters_code:
        en: en # English (Crowdin: en, Locale: en)
        de: de # German (Crowdin: de, Locale: de)
        fr: fr # French (Crowdin: fr, Locale: fr)
        es: es # Spanish (Crowdin: es, Locale: es)
        it: it # Italian (Crowdin: it, Locale: it)
        nl: nl # Dutch (Crowdin: nl, Locale: nl)
        pt: pt # Portuguese (Crowdin: pt, Locale: pt)
        pl: pl # Polish (Crowdin: pl, Locale: pl)
        uk-UA: uk # Ukrainian (Crowdin: uk-UA, Locale: uk)
        da: da # Danish (Crowdin: da, Locale: da)
        ro: ro # Romanian (Crowdin: ro, Locale: ro)
        cs: cs # Czech (Crowdin: cs, Locale: cs)
    type: "arb"
    update_option: "update_as_unapproved"
    export_quotes: "double"
    export_escaped_quotes: "true"
