name: Build Signed Release Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: Restore keystore
        run: |
          mkdir -p $HOME/Documents/keystores
          echo "$KEYSTORE_BASE64" | base64 --decode > $HOME/Documents/keystores/trudido-release-key.jks
          echo "TRUDIDO_KEYSTORE=$HOME/Documents/keystores/trudido-release-key.jks" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Get dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # PlayStore build - AAB without donations
      - name: Build PlayStore AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build appbundle --release --flavor playstore --obfuscate --split-debug-info=build/app/outputs/symbols-playstore

      - name: Rename PlayStore AAB with version
        run: |
          mv build/app/outputs/bundle/playstoreRelease/app-playstore-release.aab build/app/outputs/bundle/playstoreRelease/trudido-playstore-$VERSION.aab
        env:
          VERSION: ${{ env.VERSION }}

      # FDroid build - APK with donations enabled
      - name: Build FDroid universal APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --flavor fdroid --dart-define=IS_FDROID=true --obfuscate --split-debug-info=build/app/outputs/symbols-fdroid

      - name: Rename FDroid APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-fdroid-release.apk build/app/outputs/flutter-apk/trudido-fdroid-$VERSION.apk
        env:
          VERSION: ${{ env.VERSION }}

      # FDroid ARM64 build for F-Droid submission
      - name: Build FDroid ARM64 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --flavor fdroid --dart-define=IS_FDROID=true --target-platform=android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols-fdroid-arm64

      - name: Rename FDroid ARM64 APK with version
        run: |
          mv build/app/outputs/flutter-apk/app-fdroid-release.apk build/app/outputs/flutter-apk/trudido-fdroid-arm64-$VERSION.apk
        env:
          VERSION: ${{ env.VERSION }}

      - name: Upload PlayStore AAB
        uses: actions/upload-artifact@v4
        with:
          name: playstore-aab-${{ env.VERSION }}
          path: build/app/outputs/bundle/playstoreRelease/trudido-playstore-*.aab

      - name: Upload FDroid APKs
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-apks-${{ env.VERSION }}
          path: build/app/outputs/flutter-apk/trudido-fdroid*.apk
