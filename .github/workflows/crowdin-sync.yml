name: Crowdin Sync

on:
  push:
    branches: [main]
    paths:
      - "lib/l10n/app_en.arb"
  pull_request:
    branches: [main]
    paths:
      - "lib/l10n/app_en.arb"
  schedule:
    # Run twice daily to pull translations
    - cron: "0 8,20 * * *"
  workflow_dispatch:

jobs:
  sync-crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "master"
          channel: "master"

      - name: Get dependencies
        run: flutter pub get

      - name: Validate ARB files
        run: flutter gen-l10n --verify-only

      - name: Upload source files to Crowdin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          crowdin_branch_name: main
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}

      - name: Download translations from Crowdin
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: true
          commit_message: "chore: update translations from Crowdin [skip ci]"
          crowdin_branch_name: main
          create_pull_request: true
          pull_request_title: "Update translations from Crowdin"
          pull_request_body: |
            This PR contains updated translations from Crowdin.

            - Translations are automatically downloaded from Crowdin
            - Please review the changes before merging
            - The translations will be included in the next app release
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate localization files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: flutter gen-l10n

      - name: Commit generated files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lib/l10n/
          git diff --staged --quiet || git commit -m "chore: regenerate localization files [skip ci]"
